name: Atruvo AI Delivery Guard

on:
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Atruvo Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Atruvo
        uses: actions/checkout@v4
        with:
          repository: SennaSemakula/atruvo-delivery-guard
          token: ${{ secrets.ATRUVO_TOKEN }}
          path: .atruvo-tool

      - name: Build Atruvo
        run: |
          cd .atruvo-tool
          go build -o /usr/local/bin/atruvo ./cmd/atruvo
          atruvo --version

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: '/tmp/trivy.sarif.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Atruvo gate
        id: gate
        run: |
          GATE_ARGS="--format markdown"
          GATE_ARGS="$GATE_ARGS --output /tmp/atruvo-report.md"
          GATE_ARGS="$GATE_ARGS --json-output /tmp/atruvo-report.json"
          GATE_ARGS="$GATE_ARGS --env production"
          GATE_ARGS="$GATE_ARGS --fail-on block"

          # Add SARIF if Trivy produced output
          [ -f /tmp/trivy.sarif.json ] && GATE_ARGS="$GATE_ARGS --sarif /tmp/trivy.sarif.json"

          # Add local overlay if present
          [ -f .atruvo/policy.overlay.yaml ] && GATE_ARGS="$GATE_ARGS --local-policy .atruvo/policy.overlay.yaml"

          # Git diff for PR
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1 2>/dev/null || true
            GATE_ARGS="$GATE_ARGS --base-ref origin/$GITHUB_BASE_REF --head-ref HEAD"
          fi

          set +e
          atruvo gate $GATE_ARGS
          ATRUVO_EXIT=$?
          set -e

          echo "exit_code=$ATRUVO_EXIT" >> "$GITHUB_OUTPUT"
          exit $ATRUVO_EXIT

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/atruvo-report.md ]; then
            echo "No report file found, skipping comment"
            exit 0
          fi

          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENT_TAG="<!-- atruvo-gate-report -->"

          # Check for existing comment
          EXISTING=$(gh api \
            repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            --jq ".[] | select(.body | startswith(\"${COMMENT_TAG}\")) | .id" \
            2>/dev/null | head -1)

          BODY="${COMMENT_TAG}
          $(cat /tmp/atruvo-report.md)"

          if [ -n "$EXISTING" ]; then
            gh api \
              repos/${{ github.repository }}/issues/comments/${EXISTING} \
              -X PATCH \
              -f body="${BODY}" > /dev/null
            echo "Updated existing comment ${EXISTING}"
          else
            gh api \
              repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
              -f body="${BODY}" > /dev/null
            echo "Posted new comment"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atruvo-gate-report
          path: |
            /tmp/atruvo-report.json
            /tmp/atruvo-report.md
          if-no-files-found: ignore
